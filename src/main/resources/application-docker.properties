spring.application.name=villadictos-app

# Database Configuration (Docker MySQL)
spring.datasource.url=jdbc:mysql://${MYSQLHOST:mysql}:${MYSQLPORT:3306}/${MYSQLDATABASE:villadictos_db}?createDatabaseIfNotExist=true&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${MYSQLUSER:villadictos}
spring.datasource.password=${MYSQLPASSWORD:villadictos123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool - espera a MySQL
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.maximum-pool-size=5

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# SQL initialization
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
jwt.secret=VillaDictosHotelSecretKeyForJWTAuthenticationMustBeAtLeast256Bits
jwt.expiration=86400000
jwt.booking-token-expiration=900000

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

