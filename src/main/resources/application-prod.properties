spring.application.name=villadictos-app

# Database Configuration (Railway MySQL)
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/villadictos_db}
spring.datasource.username=${MYSQL_USER:villadictos}
spring.datasource.password=${MYSQL_PASSWORD:villadictos123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

spring.sql.init.mode=always
spring.sql.init.schema-locations=
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
jwt.secret=${JWT_SECRET:VillaDictosHotelSecretKeyForJWTAuthenticationMustBeAtLeast256Bits}
jwt.expiration=86400000
jwt.booking-token-expiration=900000

# OpenAPI / Swagger (enabled in production)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:askspace.iw@gmail.com}
spring.mail.password=${MAIL_PASSWORD:qfcdapjqkyszejhw}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# TPV Configuration
tpv.api.url=${TPV_URL:https://tpv-backend-cbbg.onrender.com}
tpv.api.key=${TPV_KEY:sk_0a4491d5-08f3-406e-ac98-d3b589d51008}

