<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Bloqueos - Villadictos Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body>

    <header class="admin-header mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h3 mb-0">Panel de Administración</h1>
            <nav>
                <a href="/dashboard" class="me-3">Volver al Dashboard</a>
                <form th:action="@{/logout}" method="POST" style="display: inline;">
                    <button type="submit" class="btn btn-sm btn-logout">Cerrar Sesión</button>
                </form>
            </nav>
        </div>
    </header>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Listado de Bloqueos</h2>
            <div>
                <a href="/admin/bloqueos/nuevo" class="btn btn-primary">Nuevo Bloqueo</a>
                <a href="/admin" class="btn btn-secondary">Volver</a>
            </div>
        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Recurso</th>
                    <th>Fechas</th>
                    <th>Motivo</th>
                    <th>Creador</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="bloqueo : ${bloqueos}">
                    <td th:text="${bloqueo.id}">1</td>
                    <td>
                        <span th:if="${bloqueo.habitacion != null}"
                            th:text="'Hab: ' + ${bloqueo.habitacion.numeroHabitacion}">Hab: 101</span>
                        <span th:if="${bloqueo.sala != null}" th:text="'Sala: ' + ${bloqueo.sala.nombre}">Sala: A</span>
                    </td>
                    <td th:text="${bloqueo.fechaInicio} + ' / ' + ${bloqueo.fechaFin}">2024-01-01 / 2024-01-05</td>
                    <td th:text="${bloqueo.motivo}">Mantenimiento</td>
                    <td th:text="${bloqueo.usuarioCreador.email}">admin@hotel.com</td>
                    <td>
                        <a th:href="@{/admin/bloqueos/editar/{id}(id=${bloqueo.id})}"
                            class="btn btn-sm btn-warning">Editar</a>
                        <a th:href="@{/admin/bloqueos/eliminar/{id}(id=${bloqueo.id})}" class="btn btn-sm btn-danger"
                            onclick="return confirm('¿Estás seguro?')">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
