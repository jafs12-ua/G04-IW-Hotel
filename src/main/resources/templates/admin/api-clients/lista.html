<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de API Clients - Admin</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        :root {
            --primary: #C17C64;
            --secondary: #1A3C34;
        }

        body {
            background: #f5f5f5;
            font-family: 'Raleway', sans-serif;
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: var(--secondary);
            font-family: 'Crimson Pro', serif;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary {
            background: var(--secondary);
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-sm {
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
        }

        .alert {
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
        }

        .table-container {
            background: white;
            border-radius: 8px;
            overflow-x: auto;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        th {
            background: var(--secondary);
            color: white;
            padding: 0.75rem;
            text-align: left;
            white-space: nowrap;
        }

        td {
            padding: 0.75rem;
            border-bottom: 1px solid #eee;
            font-size: 0.9rem;
        }

        .api-key {
            font-family: monospace;
            background: #f0f0f0;
            padding: 0.3rem 0.5rem;
            border-radius: 3px;
            font-size: 0.75rem;
            max-width: 180px;
            display: inline-block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .badge {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .badge-active {
            background: #d4edda;
            color: #155724;
        }

        .badge-inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
        }

        .back-link {
            color: var(--secondary);
            text-decoration: none;
            margin-bottom: 1rem;
            display: inline-block;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="/admin" class="back-link">← Volver al panel de administración</a>

        <div class="header">
            <h1>Gestión de Clientes API</h1>
            <a href="/admin/api-clients/nuevo" class="btn btn-primary">+ Nuevo Cliente</a>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Empresa</th>
                        <th>Contacto</th>
                        <th>Email</th>
                        <th>API Key</th>
                        <th>Estado</th>
                        <th>Peticiones</th>
                        <th>Último uso</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="client : ${clients}">
                        <td th:text="${client.empresa}">Empresa S.L.</td>
                        <td th:text="${client.nombre}">Juan Pérez</td>
                        <td th:text="${client.email}">email@empresa.com</td>
                        <td><code class="api-key" th:text="${client.apiKey}">vd_xxx...</code></td>
                        <td>
                            <span class="badge badge-active" th:if="${client.activo}">Activo</span>
                            <span class="badge badge-inactive" th:unless="${client.activo}">Inactivo</span>
                        </td>
                        <td th:text="${client.totalPeticiones}">0</td>
                        <td
                            th:text="${client.ultimoUso != null ? #temporals.format(client.ultimoUso, 'dd/MM/yyyy HH:mm') : 'Nunca'}">
                            -</td>
                        <td class="actions">
                            <form th:action="@{/admin/api-clients/{id}/toggle(id=${client.id})}" method="POST"
                                style="display:inline;">
                                <button type="submit" class="btn btn-secondary btn-sm"
                                    th:text="${client.activo ? 'Desactivar' : 'Activar'}">Toggle</button>
                            </form>
                            <form th:action="@{/admin/api-clients/{id}/regenerar(id=${client.id})}" method="POST"
                                style="display:inline;"
                                onsubmit="return confirm('¿Regenerar API Key? El cliente perderá acceso con la clave actual.')">
                                <button type="submit" class="btn btn-primary btn-sm">Regenerar</button>
                            </form>
                            <form th:action="@{/admin/api-clients/{id}/eliminar(id=${client.id})}" method="POST"
                                style="display:inline;" onsubmit="return confirm('¿Eliminar este cliente?')">
                                <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(clients)}">
                        <td colspan="8" style="text-align: center; color: #999; padding: 2rem;">
                            No hay clientes API registrados
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>

</html>
