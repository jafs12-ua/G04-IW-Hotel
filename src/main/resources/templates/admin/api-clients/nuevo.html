<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Cliente API - Admin</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        :root {
            --primary: #C17C64;
            --secondary: #1A3C34;
        }

        body {
            background: #f5f5f5;
            font-family: 'Raleway', sans-serif;
            margin: 0;
            padding: 2rem;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            color: var(--secondary);
            font-family: 'Crimson Pro', serif;
        }

        .form-card {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--secondary);
            font-weight: 500;
        }

        input,
        textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus,
        textarea:focus {
            border-color: var(--primary);
            outline: none;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
            text-decoration: none;
        }

        .buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
        }

        .back-link {
            color: var(--secondary);
            text-decoration: none;
            margin-bottom: 1rem;
            display: inline-block;
        }

        .info {
            background: #e7f3ff;
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            color: #004085;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="/admin/api-clients" class="back-link">← Volver a la lista</a>

        <h1>Registrar Nuevo Cliente API</h1>

        <div class="form-card">
            <div class="info">
                Al crear el cliente se generará automáticamente una API Key única que deberá enviarse por email al
                solicitante.
            </div>

            <form th:action="@{/admin/api-clients/crear}" method="POST">
                <div class="form-group">
                    <label for="nombre">Nombre del contacto *</label>
                    <input type="text" id="nombre" name="nombre" required placeholder="Juan Pérez">
                </div>

                <div class="form-group">
                    <label for="empresa">Empresa / Proyecto *</label>
                    <input type="text" id="empresa" name="empresa" required placeholder="Empresa S.L.">
                </div>

                <div class="form-group">
                    <label for="email">Email de contacto *</label>
                    <input type="email" id="email" name="email" required placeholder="contacto@empresa.com">
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción / Finalidad de uso</label>
                    <textarea id="descripcion" name="descripcion" rows="3"
                        placeholder="Ej: Integración para mostrar habitaciones disponibles en nuestra web"></textarea>
                </div>

                <div class="buttons">
                    <button type="submit" class="btn btn-primary">Crear Cliente</button>
                    <a href="/admin/api-clients" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
