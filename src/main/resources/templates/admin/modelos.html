<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Modelos de Reserva - Villadictos Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestión de Modelos de Reserva (Régimen)</h2>
            <div>
                <a href="/admin" class="btn btn-secondary">Volver</a>
                <a href="/admin/modelos/nuevo" class="btn btn-primary">Nuevo Modelo</a>
            </div>
        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio Adicional (Noche)</th>
                    <th>Descripción</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="modelo : ${modelos}">
                    <td th:text="${modelo.id}">1</td>
                    <td th:text="${modelo.nombre}">Pensión Completa</td>
                    <td th:text="${modelo.precioAdicionalNoche} + '€'">20€</td>
                    <td th:text="${modelo.descripcion}">Incluye desayuno, comida y cena</td>
                    <td>
                        <a th:href="@{/admin/modelos/editar/{id}(id=${modelo.id})}"
                            class="btn btn-sm btn-warning">Editar</a>
                        <a th:href="@{/admin/modelos/eliminar/{id}(id=${modelo.id})}" class="btn btn-sm btn-danger"
                            onclick="return confirm('¿Estás seguro?')">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
