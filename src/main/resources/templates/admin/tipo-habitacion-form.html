<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Formulario Tipo Habitación - Villadictos Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body>
    <div class="container mt-4">
        <h2>Formulario de Tipo de Habitación</h2>
        <form th:action="@{/admin/tipos-habitacion/guardar}" th:object="${tipo}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
            </div>

            <div class="mb-3">
                <label for="capacidadPersonas" class="form-label">Capacidad (Personas)</label>
                <input type="number" class="form-control" id="capacidadPersonas" th:field="*{capacidadPersonas}"
                    required>
            </div>

            <div class="mb-3">
                <label for="precioBaseNoche" class="form-label">Precio Base (Noche)</label>
                <input type="number" step="0.01" class="form-control" id="precioBaseNoche" th:field="*{precioBaseNoche}"
                    required>
            </div>

            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea class="form-control" id="descripcion" th:field="*{descripcion}" rows="3"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="/admin/tipos-habitacion" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>

</html>
