<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Habitaciones - Villadictos Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestión de Habitaciones</h2>
            <div>
                <a href="/admin" class="btn btn-secondary">Volver</a>
                <a href="/admin/habitaciones/nuevo" class="btn btn-primary">Nueva Habitación</a>
            </div>
        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Número</th>
                    <th>Planta</th>
                    <th>Tipo</th>
                    <th>Vistas</th>
                    <th>Destacada</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="habitacion : ${habitaciones}">
                    <td th:text="${habitacion.id}">1</td>
                    <td th:text="${habitacion.numeroHabitacion}">101</td>
                    <td th:text="${habitacion.planta}">1</td>
                    <td th:text="${habitacion.tipoHabitacion.nombre}">Doble</td>
                    <td th:text="${habitacion.vistas}">Mar</td>
                    <td th:text="${habitacion.destacada} ? 'Sí' : 'No'">No</td>
                    <td>
                        <a th:href="@{/admin/habitaciones/editar/{id}(id=${habitacion.id})}"
                            class="btn btn-sm btn-warning">Editar</a>
                        <a th:href="@{/admin/habitaciones/eliminar/{id}(id=${habitacion.id})}"
                            class="btn btn-sm btn-danger" onclick="return confirm('¿Estás seguro?')">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
