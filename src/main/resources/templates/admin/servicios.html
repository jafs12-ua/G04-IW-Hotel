<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Servicios - Villadictos Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestión de Servicios</h2>
            <div>
                <a href="/admin" class="btn btn-secondary">Volver</a>
                <a href="/admin/servicios/nuevo" class="btn btn-primary">Nuevo Servicio</a>
            </div>
        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Tipo</th>
                    <th>Descripción</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="servicio : ${servicios}">
                    <td th:text="${servicio.id}">1</td>
                    <td th:text="${servicio.nombre}">SPA</td>
                    <td th:text="${servicio.precio} + '€'">50€</td>
                    <td th:text="${servicio.tipo}">Por uso</td>
                    <td th:text="${servicio.descripcion}">Acceso al SPA</td>
                    <td>
                        <a th:href="@{/admin/servicios/editar/{id}(id=${servicio.id})}"
                            class="btn btn-sm btn-warning">Editar</a>
                        <a th:href="@{/admin/servicios/eliminar/{id}(id=${servicio.id})}" class="btn btn-sm btn-danger"
                            onclick="return confirm('¿Estás seguro?')">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
