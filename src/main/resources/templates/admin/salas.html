<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Salas - Villadictos Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestión de Salas</h2>
            <div>
                <a href="/admin" class="btn btn-secondary">Volver</a>
                <a href="/admin/salas/nuevo" class="btn btn-primary">Nueva Sala</a>
            </div>
        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Aforo Max</th>
                    <th>Precio Base (Día)</th>
                    <th>Equipamiento</th>
                    <th>Descripción</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="sala : ${salas}">
                    <td th:text="${sala.id}">1</td>
                    <td th:text="${sala.nombre}">Sala A</td>
                    <td th:text="${sala.aforoMax}">50</td>
                    <td th:text="${sala.precioBaseDia} + '€'">200€</td>
                    <td th:text="${sala.equipamiento}">Proyector, Wifi</td>
                    <td th:text="${sala.descripcion}">Descripción...</td>
                    <td>
                        <a th:href="@{/admin/salas/editar/{id}(id=${sala.id})}"
                            class="btn btn-sm btn-warning">Editar</a>
                        <a th:href="@{/admin/salas/eliminar/{id}(id=${sala.id})}" class="btn btn-sm btn-danger"
                            onclick="return confirm('¿Estás seguro?')">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
