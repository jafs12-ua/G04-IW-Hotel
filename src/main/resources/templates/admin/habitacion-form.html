<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Formulario Habitación - Villadictos Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body>
    <div class="container mt-4">
        <h2>Formulario de Habitación</h2>
        <form th:action="@{/admin/habitaciones/guardar}" th:object="${habitacion}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label for="numeroHabitacion" class="form-label">Número de Habitación</label>
                <input type="text" class="form-control" id="numeroHabitacion" th:field="*{numeroHabitacion}" required>
            </div>

            <div class="mb-3">
                <label for="planta" class="form-label">Planta</label>
                <input type="number" class="form-control" id="planta" th:field="*{planta}" required>
            </div>

            <div class="mb-3">
                <label for="tipoHabitacion" class="form-label">Tipo de Habitación</label>
                <select class="form-select" id="tipoHabitacion" th:field="*{tipoHabitacion}">
                    <option th:each="tipo : ${tipos}" th:value="${tipo.id}" th:text="${tipo.nombre}">Tipo</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="vistas" class="form-label">Vistas</label>
                <input type="text" class="form-control" id="vistas" th:field="*{vistas}">
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="destacada" th:field="*{destacada}">
                <label class="form-check-label" for="destacada">Destacada</label>
            </div>

            <button type="submit" class="btn btn-primary">Guardar</button>
            <a href="/admin/habitaciones" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>

</html>
