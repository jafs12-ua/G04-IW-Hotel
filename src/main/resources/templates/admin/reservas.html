<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Gestión de Reservas - Villadictos Hotel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Listado de Reservas</h2>
            <div>
                <a href="/admin" class="btn btn-secondary">Volver</a>
            </div>
        </div>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Recurso</th>
                    <th>Fechas</th>
                    <th>Precio Total</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="reserva : ${reservas}">
                    <td th:text="${reserva.id}">1</td>
                    <td th:text="${reserva.usuario.email}">user@example.com</td>
                    <td>
                        <span th:if="${reserva.habitacion != null}"
                            th:text="'Hab: ' + ${reserva.habitacion.numeroHabitacion}">Hab: 101</span>
                        <span th:if="${reserva.sala != null}" th:text="'Sala: ' + ${reserva.sala.nombre}">Sala: A</span>
                    </td>
                    <td th:text="${reserva.fechaInicio} + ' / ' + ${reserva.fechaFin}">2024-01-01 / 2024-01-05</td>
                    <td th:text="${reserva.precioTotal} + '€'">500€</td>
                    <td>
                        <span class="badge"
                            th:classappend="${#strings.toString(reserva.estado) == 'confirmada' ? 'bg-success' : (#strings.toString(reserva.estado) == 'cancelada' ? 'bg-danger' : 'bg-warning')}"
                            th:text="${reserva.estado}">Pendiente</span>
                    </td>
                    <td>
                        <a th:href="@{/admin/reservas/editar/{id}(id=${reserva.id})}"
                            class="btn btn-sm btn-primary">Editar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
