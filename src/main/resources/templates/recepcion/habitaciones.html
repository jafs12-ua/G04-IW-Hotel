<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recepción - Habitaciones - Villadictos Hotel</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Raleway:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #C17C64;
            --secondary: #1A3C34;
            --bg-light: #F7F7F7;
            --text-dark: #333;
        }

        body {
            background: var(--bg-light);
            font-family: 'Raleway', sans-serif;
            margin: 0;
        }

        .recep-header {
            background: var(--secondary);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .recep-logo {
            font-family: 'Crimson Pro', serif;
        }

        .recep-logo h1 {
            color: var(--primary);
            font-size: 2rem;
            letter-spacing: 3px;
            margin: 0;
        }

        .recep-logo span {
            color: var(--primary);
            font-size: 0.7rem;
            letter-spacing: 5px;
            display: block;
            text-align: center;
        }

        .recep-header-right {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .recep-header-right a {
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .btn-logout {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }

        .recep-nav {
            background: white;
            border-bottom: 1px solid #e0e0e0;
            padding: 0 2rem;
        }

        .recep-nav ul {
            list-style: none;
            display: flex;
            gap: 0;
            margin: 0;
            padding: 0;
        }

        .recep-nav li a {
            display: block;
            padding: 1rem 2rem;
            color: var(--text-dark);
            text-decoration: none;
            font-weight: 500;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .recep-nav li a:hover,
        .recep-nav li a.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .recep-main {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .recep-title {
            font-family: 'Crimson Pro', serif;
            font-size: 2rem;
            color: var(--secondary);
            margin: 0;
        }

        .search-box {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .search-box input {
            padding: 0.6rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.9rem;
            width: 250px;
        }

        .search-box input:focus {
            border-color: var(--primary);
            outline: none;
        }

        .search-box select {
            padding: 0.6rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .table-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--secondary);
            color: white;
            padding: 1rem;
            text-align: left;
            font-weight: 500;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #fafafa;
        }

        tr.hidden {
            display: none;
        }

        .badge {
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-block;
        }

        .badge-libre {
            background: #d4edda;
            color: #155724;
        }

        .badge-ocupada {
            background: #f8d7da;
            color: #721c24;
        }

        .badge-bloqueada {
            background: #fff3cd;
            color: #856404;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 500;
            display: inline-block;
        }

        .btn-primary:hover {
            background: #a66952;
        }

        .recep-footer {
            background: var(--secondary);
            color: white;
            padding: 2rem;
            text-align: center;
            margin-top: 3rem;
        }

        .recep-footer .logo {
            font-family: 'Crimson Pro', serif;
            color: var(--primary);
            font-size: 1.5rem;
        }

        .recep-footer span {
            color: var(--primary);
            font-size: 0.6rem;
            letter-spacing: 4px;
            display: block;
        }

        .results-count {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <header class="recep-header">
        <div class="recep-logo">
            <h1>Villadictos</h1>
            <span>HOTEL</span>
        </div>
        <div class="recep-header-right">
            <form th:action="@{/logout}" method="POST" style="display: inline;">
                <button type="submit" class="btn-logout">Cerrar Sesión</button>
            </form>
        </div>
    </header>

    <nav class="recep-nav">
        <ul>
            <li><a href="/recepcion">Dashboard</a></li>
            <li><a href="/recepcion/habitaciones" class="active">Habitaciones</a></li>
            <li><a href="/recepcion/reservas">Reservas</a></li>
            <li><a href="/recepcion/bloqueos">Bloqueos</a></li>
            <li><a href="/recepcion/clientes">Clientes</a></li>
        </ul>
    </nav>

    <main class="recep-main">
        <div class="page-header">
            <h1 class="recep-title">Estado de Habitaciones</h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Buscar habitación..." oninput="filterTable()">
                <select id="estadoFilter" onchange="filterTable()">
                    <option value="">Todos los estados</option>
                    <option value="LIBRE">Libres</option>
                    <option value="OCUPADA">Ocupadas</option>
                    <option value="BLOQUEADA">Bloqueadas</option>
                </select>
                <a href="/recepcion/reservas/nueva" class="btn-primary">+ Nueva Reserva</a>
            </div>
        </div>

        <p class="results-count" id="resultsCount"></p>

        <div class="table-container">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>Nº Hab.</th>
                        <th>Tipo</th>
                        <th>Planta</th>
                        <th>Capacidad</th>
                        <th>Vistas</th>
                        <th>Precio Base</th>
                        <th>Estado</th>
                        <th>Detalle</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="h : ${habitaciones}"
                        th:data-search="${h.numeroHabitacion + ' ' + h.tipoHabitacion + ' ' + h.vistas}"
                        th:data-estado="${h.estado.name()}">
                        <td th:text="${h.numeroHabitacion}">101</td>
                        <td th:text="${h.tipoHabitacion}">Doble Estándar</td>
                        <td th:text="${h.planta}">1</td>
                        <td th:text="${h.capacidad} + ' pers.'">2 pers.</td>
                        <td th:text="${h.vistas}">Mar</td>
                        <td th:text="${h.precioBase} + ' €'">80 €</td>
                        <td>
                            <span class="badge badge-libre" th:if="${h.estado.name() == 'LIBRE'}">Libre</span>
                            <span class="badge badge-ocupada" th:if="${h.estado.name() == 'OCUPADA'}">Ocupada</span>
                            <span class="badge badge-bloqueada"
                                th:if="${h.estado.name() == 'BLOQUEADA'}">Bloqueada</span>
                        </td>
                        <td th:text="${h.detalleEstado ?: '-'}">-</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer class="recep-footer">
        <div class="logo">Villadictos</div>
        <span>HOTEL</span>
    </footer>

    <script>
        function filterTable() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const estado = document.getElementById('estadoFilter').value;
            const rows = document.querySelectorAll('#dataTable tbody tr');
            let visible = 0;

            rows.forEach(row => {
                const searchData = (row.dataset.search || '').toLowerCase();
                const rowEstado = row.dataset.estado || '';

                const matchSearch = !search || searchData.includes(search);
                const matchEstado = !estado || rowEstado === estado;

                if (matchSearch && matchEstado) {
                    row.classList.remove('hidden');
                    visible++;
                } else {
                    row.classList.add('hidden');
                }
            });

            document.getElementById('resultsCount').textContent =
                visible + ' de ' + rows.length + ' habitaciones';
        }

        filterTable();
    </script>
</body>

</html>
