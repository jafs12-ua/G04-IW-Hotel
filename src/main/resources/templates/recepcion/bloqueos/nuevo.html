<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recepción - Nuevo Bloqueo - Villadictos Hotel</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Raleway:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #C17C64;
            --secondary: #1A3C34;
            --bg-light: #F7F7F7;
            --text-dark: #333;
        }

        body {
            background: var(--bg-light);
            font-family: 'Raleway', sans-serif;
        }

        .recep-header {
            background: var(--secondary);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .recep-logo {
            font-family: 'Crimson Pro', serif;
        }

        .recep-logo h1 {
            color: var(--primary);
            font-size: 2rem;
            letter-spacing: 3px;
            margin: 0;
        }

        .recep-logo span {
            color: var(--primary);
            font-size: 0.7rem;
            letter-spacing: 5px;
            display: block;
            text-align: center;
        }

        .recep-header-right {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .recep-header-right a {
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .btn-logout {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }

        .recep-nav {
            background: white;
            border-bottom: 1px solid #e0e0e0;
            padding: 0 2rem;
        }

        .recep-nav ul {
            list-style: none;
            display: flex;
            gap: 0;
            margin: 0;
            padding: 0;
        }

        .recep-nav li a {
            display: block;
            padding: 1rem 2rem;
            color: var(--text-dark);
            text-decoration: none;
            font-weight: 500;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .recep-nav li a:hover,
        .recep-nav li a.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .recep-main {
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .recep-title {
            font-family: 'Crimson Pro', serif;
            font-size: 2rem;
            color: var(--secondary);
            margin-bottom: 2rem;
            text-align: center;
        }

        .form-container {
            background: white;
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--secondary);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            outline: none;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
            font-size: 1rem;
        }

        .btn-primary:hover {
            background: #a66952;
        }

        .btn-outline {
            background: transparent;
            color: var(--secondary);
            padding: 0.75rem 2rem;
            border: 2px solid #e0e0e0;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 500;
        }

        .btn-outline:hover {
            border-color: var(--secondary);
        }

        .alert {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .alert-danger {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .error-text {
            color: #dc3545;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .recep-footer {
            background: var(--secondary);
            color: white;
            padding: 2rem;
            text-align: center;
            margin-top: 3rem;
        }

        .recep-footer .logo {
            font-family: 'Crimson Pro', serif;
            color: var(--primary);
            font-size: 1.5rem;
        }

        .recep-footer span {
            color: var(--primary);
            font-size: 0.6rem;
            letter-spacing: 4px;
            display: block;
        }
    </style>
</head>

<body>
    <header class="recep-header">
        <div class="recep-logo">
            <h1>Villadictos</h1>
            <span>HOTEL</span>
        </div>
        <div class="recep-header-right">
            <a href="/dashboard">Panel Cliente</a>
            <form th:action="@{/logout}" method="POST" style="display: inline;">
                <button type="submit" class="btn-logout">Cerrar Sesión</button>
            </form>
        </div>
    </header>

    <nav class="recep-nav">
        <ul>
            <li><a href="/recepcion">Dashboard</a></li>
            <li><a href="/recepcion/habitaciones">Habitaciones</a></li>
            <li><a href="/recepcion/reservas">Reservas</a></li>
            <li><a href="/recepcion/bloqueos" class="active">Bloqueos</a></li>
            <li><a href="/recepcion/clientes">Clientes</a></li>
        </ul>
    </nav>

    <main class="recep-main">
        <h1 class="recep-title">Nuevo Bloqueo de Habitación</h1>

        <div class="form-container">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/recepcion/bloqueos/nuevo}" th:object="${bloqueoDTO}" method="POST">
                <div class="form-group">
                    <label for="idHabitacion">Habitación *</label>
                    <select id="idHabitacion" th:field="*{idHabitacion}" required>
                        <option value="">Seleccionar habitación...</option>
                        <option th:each="hab : ${habitaciones}" th:value="${hab.id}"
                            th:text="${hab.numeroHabitacion + ' - ' + hab.tipoHabitacion.nombre}">
                        </option>
                    </select>
                    <p class="error-text" th:if="${#fields.hasErrors('idHabitacion')}" th:errors="*{idHabitacion}"></p>
                </div>

                <div class="form-group">
                    <label for="fechaInicio">Fecha de Inicio *</label>
                    <input type="date" id="fechaInicio" th:field="*{fechaInicio}" required>
                    <p class="error-text" th:if="${#fields.hasErrors('fechaInicio')}" th:errors="*{fechaInicio}"></p>
                </div>

                <div class="form-group">
                    <label for="fechaFin">Fecha de Fin *</label>
                    <input type="date" id="fechaFin" th:field="*{fechaFin}" required>
                    <p class="error-text" th:if="${#fields.hasErrors('fechaFin')}" th:errors="*{fechaFin}"></p>
                </div>

                <div class="form-group">
                    <label for="motivo">Motivo del Bloqueo *</label>
                    <textarea id="motivo" th:field="*{motivo}" rows="3" required
                        placeholder="Ej: Mantenimiento, Reparación, Fumigación..."></textarea>
                    <p class="error-text" th:if="${#fields.hasErrors('motivo')}" th:errors="*{motivo}"></p>
                </div>

                <div class="form-actions">
                    <a href="/recepcion/bloqueos" class="btn-outline">Cancelar</a>
                    <button type="submit" class="btn-primary">Crear Bloqueo</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="recep-footer">
        <div class="logo">Villadictos</div>
        <span>HOTEL</span>
    </footer>
</body>

</html>
