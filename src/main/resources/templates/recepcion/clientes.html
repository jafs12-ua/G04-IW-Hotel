<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recepción - Clientes - Villadictos Hotel</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Raleway:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #C17C64;
            --secondary: #1A3C34;
            --bg-light: #F7F7F7;
            --text-dark: #333;
        }

        body {
            background: var(--bg-light);
            font-family: 'Raleway', sans-serif;
            margin: 0;
        }

        .recep-header {
            background: var(--secondary);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .recep-logo {
            font-family: 'Crimson Pro', serif;
        }

        .recep-logo h1 {
            color: var(--primary);
            font-size: 2rem;
            letter-spacing: 3px;
            margin: 0;
        }

        .recep-logo span {
            color: var(--primary);
            font-size: 0.7rem;
            letter-spacing: 5px;
            display: block;
            text-align: center;
        }

        .recep-header-right {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .recep-header-right a {
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .btn-logout {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }

        .recep-nav {
            background: white;
            border-bottom: 1px solid #e0e0e0;
            padding: 0 2rem;
        }

        .recep-nav ul {
            list-style: none;
            display: flex;
            gap: 0;
            margin: 0;
            padding: 0;
        }

        .recep-nav li a {
            display: block;
            padding: 1rem 2rem;
            color: var(--text-dark);
            text-decoration: none;
            font-weight: 500;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .recep-nav li a:hover,
        .recep-nav li a.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .recep-main {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .recep-title {
            font-family: 'Crimson Pro', serif;
            font-size: 2rem;
            color: var(--secondary);
            margin: 0;
        }

        .search-box {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .search-box input {
            padding: 0.6rem 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 0.9rem;
            width: 300px;
        }

        .search-box input:focus {
            border-color: var(--primary);
            outline: none;
        }

        .table-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--secondary);
            color: white;
            padding: 1rem;
            text-align: left;
            font-weight: 500;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #fafafa;
        }

        tr.hidden {
            display: none;
        }

        .recep-footer {
            background: var(--secondary);
            color: white;
            padding: 2rem;
            text-align: center;
            margin-top: 3rem;
        }

        .recep-footer .logo {
            font-family: 'Crimson Pro', serif;
            color: var(--primary);
            font-size: 1.5rem;
        }

        .recep-footer span {
            color: var(--primary);
            font-size: 0.6rem;
            letter-spacing: 4px;
            display: block;
        }

        .results-count {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>
    <header class="recep-header">
        <div class="recep-logo">
            <h1>Villadictos</h1>
            <span>HOTEL</span>
        </div>
        <div class="recep-header-right">
            <form th:action="@{/logout}" method="POST" style="display: inline;">
                <button type="submit" class="btn-logout">Cerrar Sesión</button>
            </form>
        </div>
    </header>

    <nav class="recep-nav">
        <ul>
            <li><a href="/recepcion">Dashboard</a></li>
            <li><a href="/recepcion/habitaciones">Habitaciones</a></li>
            <li><a href="/recepcion/reservas">Reservas</a></li>
            <li><a href="/recepcion/bloqueos">Bloqueos</a></li>
            <li><a href="/recepcion/clientes" class="active">Clientes</a></li>
        </ul>
    </nav>

    <main class="recep-main">
        <div class="page-header">
            <h1 class="recep-title">Listado de Clientes</h1>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Buscar por nombre, email o teléfono..."
                    oninput="filterTable()">
            </div>
        </div>

        <p class="results-count" id="resultsCount"></p>

        <div class="table-container">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th>Fecha Registro</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cliente : ${clientes}"
                        th:data-search="${cliente.nombre + ' ' + cliente.email + ' ' + (cliente.telefono ?: '')}">
                        <td th:text="${cliente.id}">1</td>
                        <td th:text="${cliente.nombre}">Juan Pérez</td>
                        <td th:text="${cliente.email}">juan@email.com</td>
                        <td th:text="${cliente.telefono ?: '-'}">600 000 000</td>
                        <td th:text="${#temporals.format(cliente.fechaRegistro, 'dd/MM/yyyy')}">01/01/2025</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(clientes)}">
                        <td colspan="5" style="text-align: center; color: #999; padding: 2rem;">No hay clientes
                            registrados</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer class="recep-footer">
        <div class="logo">Villadictos</div>
        <span>HOTEL</span>
    </footer>

    <script>
        function filterTable() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#dataTable tbody tr');
            let visible = 0;

            rows.forEach(row => {
                if (!row.dataset.search) return;

                const searchData = (row.dataset.search || '').toLowerCase();

                if (!search || searchData.includes(search)) {
                    row.classList.remove('hidden');
                    visible++;
                } else {
                    row.classList.add('hidden');
                }
            });

            const total = document.querySelectorAll('#dataTable tbody tr[data-search]').length;
            document.getElementById('resultsCount').textContent =
                visible + ' de ' + total + ' clientes';
        }

        filterTable();
    </script>
</body>

</html>
