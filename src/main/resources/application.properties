spring.application.name=villadictos-app

server.port=${PORT:8080}

# Database Configuration - Railway + Local compatible
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:villadictos_db}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:villadictos}
spring.datasource.password=${MYSQLPASSWORD:villadictos123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Disable SQL initialization (using JPA entities instead)
spring.sql.init.mode=never

# JWT Configuration
jwt.secret=VillaDictosHotelSecretKeyForJWTAuthenticationMustBeAtLeast256Bits
jwt.expiration=86400000
jwt.booking-token-expiration=900000

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

