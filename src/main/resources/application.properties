spring.application.name=villadictos-app

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/villadictos_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=villadictos
spring.datasource.password=villadictos123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable SQL initialization (using JPA entities instead)
spring.sql.init.mode=never

# JWT Configuration
jwt.secret=VillaDictosHotelSecretKeyForJWTAuthenticationMustBeAtLeast256Bits
jwt.expiration=86400000
jwt.booking-token-expiration=900000

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
